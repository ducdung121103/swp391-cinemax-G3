<svg width="940" height="800" viewBox="0 0 940 800" xmlns="http://www.w3.org/2000/svg" id="svg-admin">
  <defs>
    <style>
    .actor-name { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .uc-text { font-family: Arial, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .rel-label { font-family: Arial, sans-serif; font-size: 10.5px; font-style: italic; fill: #000000; text-anchor: middle; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .note-text { font-family: Arial, sans-serif; font-size: 9.5px; fill: #1e293b; font-weight: 500; }
    .note-warn { font-family: Arial, sans-serif; font-size: 9.5px; fill: #991b1b; font-weight: 600; font-style: italic; }
    .box-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .box-sub { font-family: Arial, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    .sys-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
</style>
  </defs>

  <!-- System Boundary -->
  <rect x="180" y="20" width="740" height="755" rx="10" ry="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="200" y="44" class="sys-title">CineMax System — System Administration</text>

  <!-- ACTOR: Administrator -->
  <g id="actor-admin">
    <circle cx="85" cy="390" r="14" fill="white" stroke="black" stroke-width="2"/>
    <line x1="85" y1="404" x2="85" y2="444" stroke="black" stroke-width="2"/>
    <line x1="61" y1="418" x2="109" y2="418" stroke="black" stroke-width="2"/>
    <line x1="85" y1="444" x2="67" y2="478" stroke="black" stroke-width="2"/>
    <line x1="85" y1="444" x2="103" y2="478" stroke="black" stroke-width="2"/>
    <text x="85" y="500" class="actor-name">Administrator</text>
  </g>

  <!-- ADMIN USE CASES (12 UCs) -->
  <!-- UC-A-01: Manage Manager Accounts -->
  <g id="uc-a-01">
    <ellipse cx="330" cy="70" rx="115" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="70" class="uc-text">Manage Manager Accounts</text>
  </g>

  <!-- UC-A-02: Assign Manager to Branches -->
  <g id="uc-a-02">
    <ellipse cx="330" cy="128" rx="115" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="128" class="uc-text">Assign Manager to Branches</text>
  </g>

  <!-- UC-A-03: Manage Master Movie Catalog -->
  <g id="uc-a-03">
    <ellipse cx="330" cy="186" rx="115" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="186" class="uc-text">Manage Master Movie Catalog</text>
  </g>

  <!-- UC-A-04: Assign Movies to Branches -->
  <g id="uc-a-04">
    <ellipse cx="330" cy="244" rx="110" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="244" class="uc-text">Assign Movies to Branches</text>
  </g>

  <!-- UC-A-05: Manage Cinema Branches & Halls -->
  <g id="uc-a-05">
    <ellipse cx="330" cy="302" rx="120" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="302" class="uc-text">Manage Cinema Branches &amp; Halls</text>
  </g>

  <!-- UC-A-06: Configure Seat Grid Designer -->
  <g id="uc-a-06">
    <ellipse cx="330" cy="360" rx="115" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="360" class="uc-text">Configure Seat Grid Designer</text>
  </g>

  <!-- UC-A-07: Configure Default (Global) Pricing Template -->
  <g id="uc-a-07">
    <ellipse cx="330" cy="418" rx="145" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="418" class="uc-text">Configure Default (Global) Pricing Template</text>
  </g>

  <!-- UC-A-08: Manage Global F&B Catalog (Items & Prices) -->
  <g id="uc-a-08">
    <ellipse cx="330" cy="480" rx="145" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="480" class="uc-text">Manage Global F&amp;B Catalog (Items &amp; Prices)</text>
  </g>

  <!-- UC-A-09: Manage System Promotions & Vouchers -->
  <g id="uc-a-09">
    <ellipse cx="330" cy="542" rx="130" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="542" class="uc-text">Manage System Promotions &amp; Vouchers</text>
  </g>

  <!-- UC-A-10: Moderate User Reviews -->
  <g id="uc-a-10">
    <ellipse cx="330" cy="600" rx="105" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="600" class="uc-text">Moderate User Reviews</text>
  </g>

  <!-- UC-A-11: Generate Enterprise BI Reports -->
  <g id="uc-a-11">
    <ellipse cx="330" cy="660" rx="120" ry="21" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="660" class="uc-text">Generate Enterprise BI Reports</text>
  </g>

  <!-- UC-A-12: User Logout -->
  <g id="uc-a-12">
    <ellipse cx="330" cy="725" rx="80" ry="19" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="330" y="725" class="uc-text">User Logout</text>
  </g>

  <!-- NOTES -->
  <!-- Note 1: Manager Accounts -->
  <g id="note-a-01">
    <polygon points="495,57 775,57 785,67 785,83 495,83" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
    <polygon points="775,57 775,67 785,67" fill="#fef08a" stroke="#854d0e" stroke-width="1.2"/>
    <text x="507" y="73" class="note-text">Tạo &amp; khoá tài khoản cấp Manager chi nhánh</text>
    <line x1="445" y1="70" x2="495" y2="70" stroke="#854d0e" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- Note 2: Movies -->
  <g id="note-a-02">
    <polygon points="495,173 775,173 785,183 785,199 495,199" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
    <polygon points="775,173 775,183 785,183" fill="#fef08a" stroke="#854d0e" stroke-width="1.2"/>
    <text x="507" y="189" class="note-text">Add, Edit, Archive, Genre, Age Rating</text>
    <line x1="445" y1="186" x2="495" y2="186" stroke="#854d0e" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- Note 3: Default Pricing Template -->
  <g id="note-a-03">
    <polygon points="495,405 895,405 905,415 905,431 495,431" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
    <polygon points="895,405 895,415 905,415" fill="#fef08a" stroke="#854d0e" stroke-width="1.2"/>
    <text x="507" y="421" class="note-text">Áp dụng mặc định toàn chuỗi khi rạp không tự cấu hình riêng (cinema_id = NULL)</text>
    <line x1="475" y1="418" x2="495" y2="418" stroke="#854d0e" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- Note 4: Global F&B Catalog -->
  <g id="note-a-04">
    <polygon points="495,467 895,467 905,477 905,493 495,493" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
    <polygon points="895,467 895,477 905,477" fill="#fef08a" stroke="#854d0e" stroke-width="1.2"/>
    <text x="507" y="483" class="note-text">Danh mục &amp; giá gốc toàn chuỗi — tồn kho theo từng rạp do Manager quản lý</text>
    <line x1="475" y1="480" x2="495" y2="480" stroke="#854d0e" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- Note 5: Low Priority BI Report (Question/Pending Confirmation) -->
  <g id="note-a-05">
    <polygon points="480,647 905,647 915,657 915,673 480,673" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <polygon points="905,647 905,657 915,657" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="492" y="663" class="note-warn">⚠️ Ưu tiên thấp — cần xác nhận lại với nhóm trước khi phân công code</text>
    <line x1="450" y1="660" x2="480" y2="660" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>

  <!-- Actor to UC lines -->
  <line x1="109" y1="365" x2="218" y2="75" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="370" x2="218" y2="130" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="375" x2="218" y2="188" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="380" x2="222" y2="246" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="385" x2="212" y2="304" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="390" x2="218" y2="360" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="395" x2="190" y2="418" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="400" x2="190" y2="480" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="405" x2="205" y2="542" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="410" x2="228" y2="600" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="415" x2="215" y2="660" stroke="black" stroke-width="1.2"/>
  <line x1="109" y1="420" x2="252" y2="725" stroke="black" stroke-width="1.2"/>
</svg>