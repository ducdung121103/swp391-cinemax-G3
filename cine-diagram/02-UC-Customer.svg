<svg width="1000" height="960" viewBox="0 0 1000 960" xmlns="http://www.w3.org/2000/svg" id="svg-customer">
  <defs>
    <style>
    .actor-name { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .uc-text { font-family: Arial, sans-serif; font-size: 11.5px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .rel-label { font-family: Arial, sans-serif; font-size: 10.5px; font-style: italic; fill: #000000; text-anchor: middle; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .note-text { font-family: Arial, sans-serif; font-size: 10.5px; fill: #1e293b; font-weight: 500; }
    .box-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .box-sub { font-family: Arial, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    .sys-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
</style>
    <marker id="open-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="black" stroke-width="1.6"/>
    </marker>
    <marker id="generalize-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <polygon points="1 1, 11 6, 1 11" fill="white" stroke="black" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- System Boundary -->
  <rect x="175" y="20" width="565" height="920" rx="10" ry="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="195" y="44" class="sys-title">CineMax System — Member Portal &amp; Online Booking</text>

  <!-- ACTORS: Guest (parent) & Customer (child) -->
  <g id="actor-guest-parent">
    <circle cx="75" cy="80" r="13" fill="white" stroke="black" stroke-width="1.8"/>
    <line x1="75" y1="93" x2="75" y2="127" stroke="black" stroke-width="1.8"/>
    <line x1="55" y1="104" x2="95" y2="104" stroke="black" stroke-width="1.8"/>
    <line x1="75" y1="127" x2="59" y2="155" stroke="black" stroke-width="1.8"/>
    <line x1="75" y1="127" x2="91" y2="155" stroke="black" stroke-width="1.8"/>
    <text x="75" y="173" class="actor-name" font-size="12">Guest</text>
  </g>

  <!-- Generalization Arrow from Customer to Guest -->
  <line x1="75" y1="465" x2="75" y2="187" stroke="black" stroke-width="1.5" marker-end="url(#generalize-arrow)"/>

  <!-- Customer Actor -->
  <g id="actor-customer">
    <circle cx="75" cy="485" r="14" fill="white" stroke="black" stroke-width="2"/>
    <line x1="75" y1="499" x2="75" y2="539" stroke="black" stroke-width="2"/>
    <line x1="51" y1="513" x2="99" y2="513" stroke="black" stroke-width="2"/>
    <line x1="75" y1="539" x2="57" y2="573" stroke="black" stroke-width="2"/>
    <line x1="75" y1="539" x2="93" y2="573" stroke="black" stroke-width="2"/>
    <text x="75" y="595" class="actor-name">Customer</text>
  </g>

  <!-- COLUMN 1: Base Use Cases (Center cx=325) -->
  <!-- UC-06: Login System -->
  <g id="uc-c-login">
    <ellipse cx="325" cy="95" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="95" class="uc-text">Login System</text>
  </g>

  <!-- UC-09: Manage User Profile -->
  <g id="uc-c-07">
    <ellipse cx="325" cy="190" rx="95" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="190" class="uc-text">Manage User Profile</text>
  </g>

  <!-- UC-23: Book Tickets Online -->
  <g id="uc-c-09">
    <ellipse cx="315" cy="385" rx="100" ry="25" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="315" y="385" class="uc-text" font-weight="bold">Book Tickets Online</text>
  </g>

  <!-- UC-25: View Booking History -->
  <g id="uc-c-15">
    <ellipse cx="325" cy="585" rx="100" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="585" class="uc-text">View Booking History</text>
  </g>

  <!-- UC-39: Rate & Review Movies -->
  <g id="uc-c-18">
    <ellipse cx="325" cy="675" rx="100" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="675" class="uc-text">Rate &amp; Review Movies</text>
  </g>

  <!-- UC-38: Manage Loyalty Points -->
  <g id="uc-c-19">
    <ellipse cx="325" cy="735" rx="105" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="735" class="uc-text">Manage Loyalty Points</text>
  </g>

  <!-- UC-41: Submit Support Ticket -->
  <g id="uc-c-support">
    <ellipse cx="325" cy="795" rx="105" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="795" class="uc-text">Submit Support Ticket</text>
  </g>

  <!-- UC-43: View Notifications -->
  <g id="uc-c-noti">
    <ellipse cx="325" cy="855" rx="95" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="855" class="uc-text">View Notifications</text>
  </g>

  <!-- UC-07: User Logout -->
  <g id="uc-c-logout">
    <ellipse cx="325" cy="910" rx="80" ry="20" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="325" y="910" class="uc-text">User Logout</text>
  </g>

  <!-- COLUMN 2: Included & Extending Use Cases (Center cx=615) -->
  <!-- Extended: Google SSO Login -->
  <g id="uc-c-sso">
    <ellipse cx="615" cy="65" rx="90" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="65" class="uc-text">Google SSO Login</text>
  </g>

  <!-- Extended: Reset Forgotten Password -->
  <g id="uc-c-reset">
    <ellipse cx="615" cy="125" rx="100" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="125" class="uc-text">Reset Forgotten Password</text>
  </g>

  <!-- Extended: Change Password -->
  <g id="uc-c-pwd">
    <ellipse cx="615" cy="190" rx="85" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="190" class="uc-text">Change Password</text>
  </g>

  <!-- Included: Hold Seats -->
  <g id="uc-c-hold">
    <ellipse cx="615" cy="265" rx="105" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="265" class="uc-text">Hold Seats (300s Lock)</text>
  </g>

  <!-- Extended: Order F&B Concessions -->
  <g id="uc-c-fnb">
    <ellipse cx="615" cy="330" rx="105" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="330" class="uc-text">Order F&amp;B Concessions</text>
  </g>

  <!-- Extended: Apply Promo Voucher -->
  <g id="uc-c-promo">
    <ellipse cx="615" cy="395" rx="100" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="395" class="uc-text">Apply Promo Voucher</text>
  </g>

  <!-- Included: Pay Ticket Online -->
  <g id="uc-c-pay">
    <ellipse cx="615" cy="460" rx="95" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="460" class="uc-text">Pay Ticket Online</text>
  </g>

  <!-- Extended: Cancel Booking & Refund -->
  <g id="uc-c-cancel">
    <ellipse cx="615" cy="550" rx="110" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="550" class="uc-text">Cancel Booking &amp; Refund</text>
  </g>

  <!-- Extended: Download E-Ticket & QR -->
  <g id="uc-c-qr">
    <ellipse cx="615" cy="615" rx="105" ry="22" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="615" y="615" class="uc-text">Download E-Ticket &amp; QR</text>
  </g>

  <!-- SECONDARY ACTORS (External Systems) -->
  <!-- External: Google OAuth 2.0 -->
  <g id="ext-google-c">
    <rect x="765" y="40" width="185" height="50" rx="6" ry="6" fill="#f8fafc" stroke="black" stroke-width="1.5"/>
    <text x="857" y="60" class="box-sub">&lt;&lt;System&gt;&gt;</text>
    <text x="857" y="78" class="box-title">Google OAuth 2.0</text>
  </g>

  <!-- External: VNPay / MoMo Gateway -->
  <g id="ext-vnpay">
    <rect x="765" y="435" width="185" height="50" rx="6" ry="6" fill="#f8fafc" stroke="black" stroke-width="1.5"/>
    <text x="857" y="455" class="box-sub">&lt;&lt;System&gt;&gt;</text>
    <text x="857" y="473" class="box-title">VNPay / MoMo Gateway</text>
  </g>

  <!-- External: Email Service (SMTP) -->
  <g id="ext-smtp-c">
    <rect x="765" y="590" width="185" height="50" rx="6" ry="6" fill="#f8fafc" stroke="black" stroke-width="1.5"/>
    <text x="857" y="610" class="box-sub">&lt;&lt;System&gt;&gt;</text>
    <text x="857" y="628" class="box-title">Email Service (SMTP)</text>
  </g>

  <!-- RELATIONSHIPS -->
  <!-- Customer Actor to Column 1 Base UCs (x1=99, clear of Manage Profile) -->
  <line x1="99" y1="480" x2="242" y2="102" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="490" x2="232" y2="192" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="505" x2="216" y2="385" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="520" x2="226" y2="585" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="530" x2="226" y2="675" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="540" x2="221" y2="735" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="550" x2="221" y2="795" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="560" x2="231" y2="855" stroke="black" stroke-width="1.2"/>
  <line x1="99" y1="570" x2="246" y2="910" stroke="black" stroke-width="1.2"/>

  <!-- Extend: Google SSO Login -> Login System -->
  <path d="M 525 70 L 410 90" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="468" y="72" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- Extend: Reset Forgotten Password -> Login System -->
  <path d="M 515 120 L 410 100" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="463" y="118" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- Extend: Change Password -> Manage Profile -->
  <path d="M 530 190 L 420 190" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="475" y="181" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- RADIATING RELATIONS FROM BOOK TICKETS ONLINE -->
  <path d="M 403 368 L 515 282" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="460" y="318" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <path d="M 510 338 L 413 375" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="462" y="348" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <path d="M 515 395 L 415 388" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="465" y="390" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <path d="M 403 402 L 522 450" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="460" y="435" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- RELATIONS FROM BOOKING HISTORY -->
  <path d="M 505 558 L 423 578" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="464" y="560" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <path d="M 510 610 L 423 592" stroke="black" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow-c)"/>
  <text x="464" y="608" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- External Systems Lines -->
  <line x1="705" y1="65" x2="765" y2="65" stroke="black" stroke-width="1.2"/>
  <line x1="710" y1="460" x2="765" y2="460" stroke="black" stroke-width="1.2"/>
  <line x1="720" y1="615" x2="765" y2="615" stroke="black" stroke-width="1.2"/>
</svg>