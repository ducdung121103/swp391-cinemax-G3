  <script>
    const stage = document.getElementById('stage');
    const container = document.getElementById('svgContainer');
    const zoomVal = document.getElementById('zoomVal');
    const svgElem = container.querySelector('svg');

    let scale = 1;
    let pointX = 30;
    let pointY = 20;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      zoomVal.textContent = Math.round(scale * 100) + '%';
    }

    function fitToScreen() {
      const stageRect = stage.getBoundingClientRect();
      const svgWidth = 1060;
      const svgHeight = 520;
      const scaleX = (stageRect.width - 40) / svgWidth;
      const scaleY = (stageRect.height - 40) / svgHeight;
      scale = Math.min(scaleX, scaleY, 1.4);
      pointX = (stageRect.width - svgWidth * scale) / 2;
      pointY = (stageRect.height - svgHeight * scale) / 2;
      updateTransform();
    }

    stage.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
    });

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = -e.deltaY;
      let newScale = delta > 0 ? scale * 1.15 : scale / 1.15;
      if (newScale < 0.3) newScale = 0.3;
      if (newScale > 3.0) newScale = 3.0;

      pointX = e.clientX - xs * newScale;
      pointY = e.clientY - ys * newScale;
      scale = newScale;
      updateTransform();
    }, { passive: false });

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      scale = Math.min(scale * 1.2, 3.0);
      updateTransform();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      scale = Math.max(scale / 1.2, 0.3);
      updateTransform();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      scale = 1;
      pointX = 30;
      pointY = 20;
      updateTransform();
    });

    document.getElementById('btnFit').addEventListener('click', fitToScreen);

    document.getElementById('btnDownloadSvg').addEventListener('click', () => {
      const serializer = new XMLSerializer();
      const svgBlob = new Blob([serializer.serializeToString(svgElem)], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'screen-flow-cinemax.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    document.getElementById('btnDownloadPng').addEventListener('click', () => {
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svgElem);
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scaleFactor = 2;
        canvas.width = 1060 * scaleFactor;
        canvas.height = 520 * scaleFactor;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scaleFactor, scaleFactor);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = 'screen-flow-cinemax.png';
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = url;
    });

    window.addEventListener('load', fitToScreen);
    window.addEventListener('resize', fitToScreen);
  </script>
</body>
</html>
