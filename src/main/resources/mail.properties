# ============================================================
# CineMax Email Service Configuration (M-01.2 / M-09)
# Gmail SMTP - Yêu cầu bật 2-Step Verification & dùng App Password
# Hướng dẫn: https://myaccount.google.com/apppasswords
# ============================================================

# --- Điền thông tin Gmail của bạn vào đây ---
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.starttls.required=true

# TÀI KHOẢN GỬI MAIL — ưu tiên điền trong mail.local.properties (gitignore)
# Nếu để placeholder, EmailService chạy STUB (log console, không SMTP).
mail.username=your-email@gmail.com
mail.password=your-app-password

# Tên hiển thị trong email gửi đi
mail.from.name=CineMax Cinema
mail.from.address=your-email@gmail.com

# Thời hạn OTP (phút)
mail.otp.expiry.minutes=10
